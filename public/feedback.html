<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="feedback.pageTitle">Feedback</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: url('images/goa.jpg') center/cover no-repeat;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
}

.box {
  position: relative;
  z-index: 2;
  width: 90%;
  max-width: 500px;
  margin: 120px auto;
  background: white;
  padding: 30px;
  border-radius: 10px;
}

h2 {
  text-align: center;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}

button {
  width: 100%;
  padding: 12px;
  background: black;
  color: white;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="box">
  <h2 data-i18n="feedback.heading">Feedback</h2>
  <input type="text" data-i18n-placeholder="feedback.namePlaceholder" placeholder="Your Name">
  <textarea data-i18n-placeholder="feedback.feedbackPlaceholder" placeholder="Your feedback"></textarea>
  <button data-i18n="feedback.submit">Submit</button>
</div>

</body>
</html>
