<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SoloSafar — Blog</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#f4efe6;--warm-black:#1a1208;--rust:#c44b2a;--paper:#e8e0d0}
    body{font-family:'Space Grotesk',sans-serif;background:var(--cream);color:var(--warm-black);margin:0;padding:48px}
    .container{max-width:900px;margin:0 auto}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    h1{font-family:'Playfair Display',serif;margin:0}
    .post{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,0.06)}
    .post h2{margin:0 0 6px}
    .meta{color:rgba(26,18,8,0.6);font-size:0.9rem;margin-bottom:8px}
    .content{line-height:1.7;color:rgba(26,18,8,0.9)}
    .empty{background:#fff;padding:20px;border-radius:12px;text-align:center;color:rgba(26,18,8,0.6)}
    .btn-back{background:transparent;border:1px solid rgba(26,18,8,0.12);padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--warm-black)}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SoloSafar Blog</h1>
      <div>
        <a class="btn-back" href="homepage.html">← Back</a>
      </div>
    </header>
    <main id="blogList"></main>
  </div>
  <script>
    function renderBlogs() {
      const blogList = document.getElementById('blogList');
      const blogs = JSON.parse(localStorage.getItem('soloSafarBlogs') || '[]');
      if (!blogs.length) {
        blogList.innerHTML = '<div class="empty">No blog posts yet. Post from your Travel Journal.</div>';
        return;
      }
      // render newest first
      blogList.innerHTML = blogs.slice().reverse().map(b => `
        <article class="post">
          <h2>${b.title || 'Untitled'}</h2>
          <div class="meta">By ${b.author || 'Anonymous'} · ${b.location ? b.location + ' · ' : ''}${new Date(b.publishedAt || b.date).toLocaleString()}</div>
          <div class="content">${(b.text || '').replace(/\n/g, '<br/>')}</div>
        </article>
      `).join('');
    }
    renderBlogs();
  </script>
</body>
</html>
